[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashforensics"
version = "1.0.0"
description = "Agentic recovery for corrupted flash storage: filesystem parsing, entropy-guided carving and evidence-based recovery verdicts"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mithin Sagar S", email = "mithinsagar@gmail.com" }]
keywords = ["forensics", "data-recovery", "fat32", "exfat", "file-carving", "langgraph", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Recovery Tools",
]

dependencies = [
    "numpy>=1.24",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "httpx>=0.26",
    "chromadb>=0.5,<0.7",
    "langgraph>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "mcp>=1.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/mithinsagar/flashforensics-ai"
Repository = "https://github.com/mithinsagar/flashforensics-ai"
Issues = "https://github.com/mithinsagar/flashforensics-ai/issues"

[project.scripts]
flashforensics = "flashforensics.cli:main"
flashforensics-mcp = "flashforensics.mcp_server.server:main"

[tool.setuptools.packages.find]
include = ["flashforensics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that generate a full disk image",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
